# Server Port Configuration
server.port=8082

# Database Configuration (Default: In-Memory H2 for seamless setup)
spring.datasource.url=jdbc:h2:mem:droppydb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# To switch to PostgreSQL 15, uncomment the lines below:
# spring.datasource.url=jdbc:postgresql://localhost:5432/droppy
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Liquibase configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# FastAPI AI service URL
droppy.ai.url=http://localhost:8001

# Active Devices list (default MAC address from CSV)
droppy.devices=1C:69:20:35:73:C4
